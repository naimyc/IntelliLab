version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: my_project_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
      POSTGRES_DB: ${DB_NAME:-my_project_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Point this to your infra folder:
      - ./infra/init-scripts:/docker-entrypoint-initdb.d

volumes:
  volumes:
      - postgres_data:/var/lib/postgresql/data